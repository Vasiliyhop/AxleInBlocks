name: Bug report
description: Report a reproducible problem in Axle in Blocks
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Active maintenance is limited, so a response is not guaranteed. Detailed reports and pull requests are welcome.

  - type: input
    id: game-version
    attributes:
      label: Vintage Story version
      placeholder: "1.22.3"
    validations:
      required: true

  - type: input
    id: mod-version
    attributes:
      label: Axle in Blocks version
      placeholder: "1.22.3"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Singleplayer
        - Multiplayer client
        - Dedicated server
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Explain the expected and actual behavior.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Place ...
        2. Connect ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste only the relevant excerpt or attach the log file. Remove private information first.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I tested without unrelated third-party mods where practical.
          required: true
        - label: I checked that this problem has not already been reported.
          required: true
